Title: Chemical Checker Signaturizer 3D D1-5
Description: Summarises how a compound is expected to perturb cells, drawing on the
  five D spaces of the Chemical Checker, which cover transcriptional response, growth
  inhibition across cancer cell lines, chemical genetics, cell morphology and cell-based
  bioassays. The deep networks behind them were obtained by fine-tuning Uni-Mol on
  single optimised 3D conformers, following evidence that roughly 40% of stereoisomer
  pairs among more than a million compounds bind differently. Cellular signatures
  are inferred from structure alone, so they anticipate rather than replace phenotypic
  screening.
